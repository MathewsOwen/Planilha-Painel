# Atualiza docs/index.html no push. Publicação: Settings → Pages → Branch main → pasta /docs
name: Atualizar painel publicado

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/index.html"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar HTML a partir da planilha de exemplo
        run: |
          cd standalone
          python build.py
          cp dashboard.html ../docs/index.html

      - name: Publicar em docs/index.html
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: atualiza painel em docs/index.html"
          file_pattern: docs/index.html
          skip_dirty_check: true
